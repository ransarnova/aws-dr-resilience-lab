apiVersion: apps/v1
kind: Deployment
metadata:
  name: dr-order-api
  labels:
    app: dr-order-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dr-order-api
  template:
    metadata:
      labels:
        app: dr-order-api
    spec:
      containers:
        - name: order-api
          image: aws-dr-order-api:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5